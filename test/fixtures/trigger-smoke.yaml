apiVersion: v1
kind: ServiceAccount
metadata:
  name: tekton-triggers-smoke
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tekton-triggers-smoke
subjects:
  - kind: ServiceAccount
    name: tekton-triggers-smoke
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tekton-triggers-eventlistener-roles
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tekton-triggers-smoke
subjects:
  - kind: ServiceAccount
    name: tekton-triggers-smoke
    namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tekton-triggers-eventlistener-clusterroles
---
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerTemplate
metadata:
  name: tekton-codex-smoke
spec:
  resourcetemplates:
    - apiVersion: tekton.dev/v1
      kind: TaskRun
      metadata:
        name: tekton-codex-trigger-smoke
      spec:
        taskRef:
          name: tekton-codex-smoke
---
apiVersion: triggers.tekton.dev/v1beta1
kind: EventListener
metadata:
  name: tekton-codex-smoke
spec:
  serviceAccountName: tekton-triggers-smoke
  triggers:
    - name: github-push
      interceptors:
        - ref:
            name: github
          params:
            - name: secretRef
              value:
                secretName: github-webhook
                secretKey: secretToken
            - name: eventTypes
              value: [push]
      template:
        ref: tekton-codex-smoke
