name: Credentialed GitHub App smoke

on:
  workflow_dispatch:
    inputs:
      pull_request:
        description: Pull request containing .tekton/pac-smoke.yaml
        required: true
        type: number

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    environment: github-app-smoke
    steps:
      - uses: actions/checkout@v4
      - uses: helm/kind-action@v1
        with:
          install_only: true
      - name: Install pinned Pipelines and Pipelines-as-Code
        run: |
          kind create cluster --name tekton-github-app --wait 120s
          kubectl --context kind-tekton-github-app apply -f https://github.com/tektoncd/pipeline/releases/download/v1.14.0/release.yaml
          kubectl --context kind-tekton-github-app wait -n tekton-pipelines --for=condition=Available deployment/tekton-pipelines-controller --timeout=300s
          kubectl --context kind-tekton-github-app apply -f https://github.com/tektoncd/pipelines-as-code/releases/download/v0.49.0/release.k8s.yaml
          for deployment in pipelines-as-code-controller pipelines-as-code-watcher pipelines-as-code-webhook; do
            kubectl --context kind-tekton-github-app wait -n pipelines-as-code --for=condition=Available "deployment/$deployment" --timeout=300s
          done
      - name: Install gosmee
        env:
          GOBIN: ${{ runner.temp }}/bin
        run: |
          mkdir -p "$GOBIN"
          go install github.com/chmouel/gosmee@latest
          echo "$GOBIN" >> "$GITHUB_PATH"
      - name: Exercise GitHub App and ChatOps
        env:
          TEKTON_CONTEXT: kind-tekton-github-app
          GITHUB_APP_ID: ${{ vars.GITHUB_APP_ID }}
          GITHUB_APP_INSTALLATION_ID: ${{ vars.GITHUB_APP_INSTALLATION_ID }}
          GITHUB_APP_PRIVATE_KEY: ${{ secrets.GITHUB_APP_PRIVATE_KEY }}
          GITHUB_WEBHOOK_SECRET: ${{ secrets.GITHUB_WEBHOOK_SECRET }}
          GITHUB_SMEE_URL: ${{ secrets.GITHUB_SMEE_URL }}
          GITHUB_TEST_REPOSITORY: ${{ github.repository }}
          GITHUB_TEST_PR: ${{ inputs.pull_request }}
        run: scripts/github-app-smoke.sh
      - name: Collect redacted diagnostics
        if: failure()
        run: |
          kubectl --context kind-tekton-github-app get pipelineruns -A -o wide
          kubectl --context kind-tekton-github-app get pods -A
      - name: Delete disposable cluster
        if: always()
        run: kind delete cluster --name tekton-github-app
